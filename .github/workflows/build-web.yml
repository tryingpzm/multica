# 构建前端镜像并推到 ghcr.io。
#
# 为什么需要：服务器上跑的前端是上游官方镜像（multica-ai/multica-web），
# 不含 personal-agent 面板。面板代码在本仓库的 apps/web 里，
# 必须从本仓库构建才能用。
#
# 和 release.yml 的区别：
#   release.yml  打 tag 时触发，构建多架构（amd64 + arm64），很慢
#   本文件       手动或 push 时触发，只构建 amd64（服务器就是 amd64）
#
# 服务器那边拉：
#   MULTICA_WEB_REF=ghcr.io/tryingpzm/multica-web:latest
#
# 首次用需要在仓库 Settings → Actions → General 里确认
# Workflow permissions 允许 "Read and write"（推 ghcr 要用 GITHUB_TOKEN）。

name: build-web

on:
  workflow_dispatch:          # 手动触发（Actions 页面点 Run workflow）
  push:
    branches: [main]
    paths:                    # 只有前端相关改动才构建，省额度
      - 'apps/web/**'
      - 'packages/views/**'
      - 'packages/core/**'
      - 'Dockerfile.web'
      - '.github/workflows/build-web.yml'

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/multica-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64       # 服务器是 x86，不需要 arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            REMOTE_API_URL=http://backend:8080
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=build-web
          cache-to: type=gha,mode=max,scope=build-web

      - name: 摘要
        run: |
          echo "### 镜像已推送" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "服务器上改 \`MULTICA_WEB_REF\` 指向它，然后 \`docker compose up -d frontend\`。" >> $GITHUB_STEP_SUMMARY
